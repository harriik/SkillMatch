# Balanced memory for Gradle (not too high, not too low)
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
org.gradle.parallel=false
org.gradle.daemon=false
org.gradle.caching=false

android.useAndroidX=true
android.suppressSdkAttributes=compileSdk
kotlin.incremental=false
kotlin.incremental.java=false
android.nonTransitiveRClass=true

# CRITICAL: Force Kotlin to run in a separate process to avoid drive-root path conflicts
kotlin.compiler.execution.strategy=out-of-process

name: firstreview
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.1+2

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter

  google_fonts: ^6.2.1
  cupertino_icons: ^1.0.8
  
  firebase_core: ^3.10.1
  firebase_auth: ^5.4.1
  cloud_firestore: ^5.6.2
  firebase_storage: ^12.4.10
  google_sign_in: ^6.2.2
  file_picker: ^8.1.7
  image_picker: ^1.1.2
  supabase_flutter: ^2.8.3
  http: ^1.2.1
  url_launcher: ^6.3.1

flutter_icons:
  android: true
  ios: true
  image_path: "assets/icon/logo.png"

dev_dependencies:
  flutter_launcher_icons: ^0.13.1
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icon/logo.png
